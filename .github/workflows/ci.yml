# Vérification automatique : à chaque PR (et sur main), le typecheck et toute la suite de tests, sur Linux.
# Le ruleset de main peut ensuite exiger « Typecheck et tests » avant toute fusion.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Typecheck et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      # ffmpeg (vidéos), restic (sauvegardes), zsh (shell des commandes). Chrome est déjà sur l'image GitHub.
      # Un miroir Ubuntu lent peut faire durer l'installation plusieurs minutes (vu : 6 min au lieu de 30 s).
      # Jamais de question pendant l'installation (needrestart, debconf), des réessais et un délai par
      # connexion, 10 minutes au plus. Si ça échoue quand même, les tests continuent : ceux qui ont besoin
      # de ffmpeg ou de restic sont sautés.
      - name: Outils système
        timeout-minutes: 10
        continue-on-error: true
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
          NEEDRESTART_SUSPEND: "1"
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
          sudo -E apt-get $APT update -q
          sudo -E apt-get $APT install -y -q --no-install-recommends ffmpeg restic zsh

      # Plusieurs tests créent des dépôts git et y commitent.
      - name: Identité git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
